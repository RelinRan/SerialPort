name: Release JAR

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "${project_version}" || "${tag_version}" != "${project_version}" ]]; then
            echo "Tag version ${tag_version} does not match VERSION_NAME ${project_version}." >&2
            exit 1
          fi
          echo "version=${project_version}" >> "${GITHUB_OUTPUT}"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release AAR
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Create versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist extracted-aar
          unzip -q app/build/outputs/aar/app-release.aar classes.jar -d extracted-aar
          mv extracted-aar/classes.jar "dist/serial-${{ steps.version.outputs.version }}.jar"
          test -s "dist/serial-${{ steps.version.outputs.version }}.jar"
          jar tf "dist/serial-${{ steps.version.outputs.version }}.jar" | grep -F 'android/serial/port/api/Serial.class'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/serial-${{ steps.version.outputs.version }}.jar
