name: Release AAR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 2.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            tag_version="${project_version}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_version="${{ inputs.version }}"
          fi
          if [[ -z "${project_version}" || "${tag_version}" != "${project_version}" ]]; then
            echo "Tag version ${tag_version} does not match VERSION_NAME ${project_version}." >&2
            exit 1
          fi
          echo "version=${project_version}" >> "${GITHUB_OUTPUT}"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release AAR
        run: ./gradlew :library:testDebugUnitTest :library:assembleRelease --no-daemon --stacktrace

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp library/build/outputs/aar/library-release.aar "dist/serial-api-android-${{ steps.version.outputs.version }}.aar"
          unzip -l "dist/serial-api-android-${{ steps.version.outputs.version }}.aar" | grep -F 'jni/arm64-v8a/libserial.so'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.aar
